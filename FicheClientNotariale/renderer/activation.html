<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
<title>Activation — FicheClientNotariale</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Georgia',serif;
  background:#1B3A6B;
  color:#FFFFFF;
  height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  user-select:none;
}

.card{
  background:#0F2548;
  border:1px solid rgba(201,149,42,.35);
  border-radius:8px;
  width:440px;
  box-shadow:0 8px 40px rgba(0,0,0,.5);
  overflow:hidden;
}

.card-header{
  background:#142d55;
  border-bottom:2px solid #C9952A;
  padding:1.4rem 1.8rem 1.1rem;
  display:flex;align-items:center;gap:.9rem;
}
.logo-box{
  width:40px;height:40px;border:2px solid #C9952A;border-radius:3px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;color:#C9952A;font-weight:700;flex-shrink:0;
}
.header-text{}
.app-name{font-size:1.05rem;font-weight:700;letter-spacing:.05em;color:#FFFFFF;}
.app-version{font-size:.65rem;letter-spacing:.2em;color:rgba(255,255,255,.5);text-transform:uppercase;margin-top:.08rem;}

.card-body{padding:1.6rem 1.8rem;}

.section-title{
  font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;
  color:#C9952A;font-family:'Courier New',monospace;font-weight:600;
  margin-bottom:.7rem;
}

.fingerprint-box{
  background:#0a1d38;
  border:1px solid rgba(201,149,42,.25);
  border-radius:4px;
  padding:.65rem .9rem;
  display:flex;align-items:center;justify-content:space-between;
  gap:.5rem;
  margin-bottom:1.2rem;
}
.fingerprint-val{
  font-family:'Courier New',monospace;font-size:.72rem;color:rgba(255,255,255,.7);
  letter-spacing:.05em;word-break:break-all;line-height:1.4;
}
.copy-btn{
  background:rgba(201,149,42,.15);border:1px solid rgba(201,149,42,.4);
  border-radius:3px;color:#C9952A;cursor:pointer;
  padding:.3rem .6rem;font-size:.65rem;font-family:'Courier New',monospace;
  white-space:nowrap;transition:background .2s;flex-shrink:0;
}
.copy-btn:hover{background:rgba(201,149,42,.3);}
.copy-btn.copied{color:#4caf50;border-color:rgba(76,175,80,.4);}

.key-group{display:flex;flex-direction:column;gap:.4rem;margin-bottom:1rem;}
.key-label{font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.55);font-family:'Courier New',monospace;}
.key-input{
  background:#0a1d38;
  border:1.5px solid rgba(201,149,42,.35);border-radius:4px;
  padding:.6rem .9rem;
  font-family:'Courier New',monospace;font-size:.82rem;
  color:#FFFFFF;outline:none;width:100%;
  letter-spacing:.08em;text-transform:uppercase;
  transition:border-color .2s;
}
.key-input::placeholder{color:rgba(255,255,255,.2);}
.key-input:focus{border-color:#C9952A;box-shadow:0 0 0 2px rgba(201,149,42,.15);}
.key-input.error{border-color:#f44336;}

.error-msg{
  background:rgba(244,67,54,.1);border:1px solid rgba(244,67,54,.3);border-radius:4px;
  padding:.55rem .8rem;
  font-size:.75rem;color:#f9a09a;line-height:1.4;
  display:none;margin-bottom:.8rem;
}
.error-msg.visible{display:block;}

.activate-btn{
  width:100%;padding:.75rem;
  background:#C9952A;border:none;border-radius:4px;
  font-family:'Georgia',serif;font-size:.88rem;font-weight:700;letter-spacing:.06em;
  color:#0a1d38;cursor:pointer;transition:background .2s;
  text-transform:uppercase;
}
.activate-btn:hover{background:#e8a93a;}
.activate-btn:disabled{background:rgba(201,149,42,.35);color:rgba(10,29,56,.5);cursor:not-allowed;}

.help-text{
  margin-top:1.1rem;
  font-size:.68rem;color:rgba(255,255,255,.35);line-height:1.5;
  text-align:center;font-family:'Courier New',monospace;
}

.success-overlay{
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:.8rem;padding:2rem;text-align:center;
}
.success-overlay.visible{display:flex;}
.success-icon{font-size:2.5rem;}
.success-title{font-size:1.1rem;color:#4caf50;font-weight:700;}
.success-sub{font-size:.75rem;color:rgba(255,255,255,.6);}
</style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <div class="logo-box">⚖</div>
    <div class="header-text">
      <div class="app-name">FicheClientNotariale</div>
      <div class="app-version">Version 13.0 — Activation requise</div>
    </div>
  </div>

  <div class="card-body" id="main-content">
    <div class="section-title">Identifiant de cette machine</div>
    <div class="fingerprint-box">
      <div class="fingerprint-val" id="fingerprint-display">Chargement…</div>
      <button class="copy-btn" id="copy-btn" onclick="copyFingerprint()">Copier</button>
    </div>

    <div class="key-group">
      <div class="key-label">Clé de licence</div>
      <input
        class="key-input"
        id="key-input"
        type="text"
        placeholder="FNOTAIRE-XXXX-XXXX-XXXX-XXXX-XXXX-XX"
        maxlength="46"
        autocomplete="off"
        spellcheck="false"
        oninput="formatKey(this)"
        onkeydown="onKeyDown(event)"
      >
    </div>

    <div class="error-msg" id="error-msg"></div>

    <button class="activate-btn" id="activate-btn" onclick="activate()">
      Activer le logiciel
    </button>

    <div class="help-text">
      Communiquez l'identifiant machine à votre fournisseur<br>
      pour recevoir votre clé de licence.
    </div>
  </div>

  <div class="success-overlay" id="success-overlay">
    <div class="success-icon">✅</div>
    <div class="success-title">Activation réussie</div>
    <div class="success-sub">Le logiciel va s'ouvrir dans un instant…</div>
  </div>
</div>

<script>
// Load machine fingerprint on startup
window.addEventListener('DOMContentLoaded', async () => {
  if (window.electronAPI) {
    const fp = await window.electronAPI.getMachineFingerprint();
    document.getElementById('fingerprint-display').textContent = fp;
  }
});

function copyFingerprint() {
  const fp = document.getElementById('fingerprint-display').textContent;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(fp).then(() => {
      const btn = document.getElementById('copy-btn');
      btn.textContent = 'Copié ✓';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copier'; btn.classList.remove('copied'); }, 2000);
    });
  }
}

// Auto-format key with dashes as user types
function formatKey(input) {
  let val = input.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
  // Insert dashes: FNOTAIRE + groups of 4 + final 2
  // Format: FNOTAIRE-XXXX-XXXX-XXXX-XXXX-XXXX-XX (prefix 8 + 4+4+4+4+4+2=22)
  let out = '';
  if (val.length > 0) out = val.slice(0, 8);
  if (val.length > 8)  out += '-' + val.slice(8, 12);
  if (val.length > 12) out += '-' + val.slice(12, 16);
  if (val.length > 16) out += '-' + val.slice(16, 20);
  if (val.length > 20) out += '-' + val.slice(20, 24);
  if (val.length > 24) out += '-' + val.slice(24, 28);
  if (val.length > 28) out += '-' + val.slice(28, 30);
  input.value = out;
  input.classList.remove('error');
  document.getElementById('error-msg').classList.remove('visible');
}

function onKeyDown(e) {
  if (e.key === 'Enter') activate();
}

async function activate() {
  const key = document.getElementById('key-input').value.trim();
  if (!key) {
    showError('Veuillez entrer une clé de licence.');
    return;
  }

  const btn = document.getElementById('activate-btn');
  btn.disabled = true;
  btn.textContent = 'Vérification…';

  const result = await window.electronAPI.activateLicense(key);

  if (result.success) {
    document.getElementById('main-content').style.display = 'none';
    document.getElementById('success-overlay').classList.add('visible');
  } else {
    btn.disabled = false;
    btn.textContent = 'Activer le logiciel';
    showError(result.message || 'Erreur inconnue. Réessayez.');
    document.getElementById('key-input').classList.add('error');
  }
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.classList.add('visible');
}
</script>
</body>
</html>
